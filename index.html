<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scholarship Monitoring System</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>Scholarship Monitoring</h1><div><span id="who"></span> <button id="out" class="sec hide">Sign out</button></div></header>
<div id="msg" role="status"></div>
<main>
<section id="login"><h2>Sign in</h2><div class="row"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="in">Sign in</button></div></section>

<div id="scholar" class="hide">
<section><h2>Submit semester grades</h2><div class="row">
<input id="ay" value="2026-2027" aria-label="Academic year"><select id="sem"><option>1</option><option>2</option></select>
<input id="gwa" type="number" step="0.01" placeholder="GWA (1.00-5.00)"><input id="units" type="number" placeholder="Units">
<input id="failed" type="number" placeholder="Failed"><input id="inc" type="number" placeholder="INC"><input id="drop" type="number" placeholder="Dropped">
<input id="ev" placeholder="Grade document reference"><button id="sub">Submit</button></div>
<small>If a record was returned, change the values and press Submit again to resubmit.</small></section>
<section><h2>My submissions</h2><div class="tablewrap"><table id="mine"></table></div></section></div>

<div id="staff" class="hide">
<section><h2>Dashboard</h2><div class="row"><input id="fay" value="2026-2027" aria-label="Year"><select id="fsem"><option>1</option><option>2</option></select></div><div class="stats" id="stats"></div></section>
<section><h2>Register scholar</h2><div class="row"><input id="rsid" placeholder="Student ID"><input id="rname" placeholder="Full name"><input id="ruid" placeholder="Auth user UUID"><select id="rprog"></select><button id="reg">Register and assign</button></div></section>
<section><h2>Submissions</h2><div class="row"><input id="q" placeholder="Search ID or name"><select id="fp"><option value="">All programs</option></select>
<select id="fc"><option value="">All compliance</option><option>Not Evaluated</option><option>Compliant</option><option>With Deficiency</option></select><button id="go" class="sec">Apply</button></div>
<div class="tablewrap"><table id="all"></table></div></section>
<section><h2>History</h2><div id="hist"><small>Select a row to view history.</small></div></section></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="app.js"></script></body></html>
